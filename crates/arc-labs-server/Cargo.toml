[package]
name         = "arc-labs-server"
description  = "Axum HTTP + WebSocket shell. Serves the same UI bundle the desktop app embeds, for headless Linux, browsers and Docker."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
arc-labs-core = { workspace = true }
arc-labs-api  = { workspace = true }
arc-labs-mcp  = { workspace = true }
arc-labs-weave = { workspace = true }
anyhow        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tracing       = { workspace = true }
tokio         = { workspace = true }
axum          = { workspace = true }
tower-http    = { workspace = true }
getrandom = "0.4.3"
arc-labs-index.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["process", "rt-multi-thread", "macros"] }
