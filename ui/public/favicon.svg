<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    The same geometry as ArcMark.svelte, at the one size a browser tab gives you.

    Two differences from the in-app mark, both forced by where this is drawn.
    A favicon has no `currentColor` to inherit, so the accent is written out; and
    it sits on browser chrome that may be light or dark, so it carries its own
    ground rather than trusting the tab strip to be dark.
  -->
  <rect width="24" height="24" rx="5" fill="#0e1113" />
  <g stroke="#5f9e8c" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M11.05 4.2 L3.45 17.8" />
    <path d="M12.95 4.2 L20.55 17.8" />
    <path d="M4.4 19.5 L19.6 19.5" />
  </g>
  <path
    d="M16.2 12.7 L14.1 9.06 L9.9 9.06 L7.8 12.7 L9.9 16.34 L14.1 16.34 Z"
    fill="none"
    stroke="#5f9e8c"
    stroke-width="1.4"
    stroke-linejoin="round"
  />
  <circle cx="12" cy="12.7" r="1.15" fill="#5f9e8c" />
</svg>
