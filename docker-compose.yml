# Bring up ARC-LABS against a vault on the host.
#
#   ARC_LABS_VAULT_PATH=~/notes docker compose up
#
# The token is printed once in the container logs; the bind is not loopback, so
# there is no configuration in which the port is open without one.

services:
  arc-labs:
    build: .
    image: arc-labs:0.1.0
    # The image runs as uid 10001. A bind-mounted vault is owned by whoever
    # created it on the host, and a mismatch means the container cannot write
    # the index or the ledger — the app comes up looking fine and silently
    # cannot save. Run as the invoking user instead.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      # Read-only until Phase 1 introduces a write path. The container cannot
      # modify the vault even if something in it tried to.
      - "${ARC_LABS_VAULT_PATH:-./fixtures/vaults/etron}:/vault:ro"
    environment:
      ARC_LABS_VAULT: /vault
      # Reaching the host's Ollama from inside the container (Phase 5).
      ARC_LABS_LOG: "arc_labs=info"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
